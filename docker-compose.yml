services:
  web:
    build: .
    container_name: docker-challenge-web
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/tododb
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: docker-challenge-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tododb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tododb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
